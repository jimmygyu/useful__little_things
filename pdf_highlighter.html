<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF 하이라이터</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', 'Noto Sans KR', 'Noto Sans CJK KR', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    /* Offline/Fallback utility styles matching Tailwind classes */
    body { display: flex; flex-direction: column; width: 100vw; height: 100vh; }
    header {
      height: 52px; background-color: #18181b; border-bottom: 1px solid #27272a;
      padding: 8px 16px; display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-shrink: 0; z-index: 50;
    }
    header > div { display: flex; align-items: center; gap: 8px; }
    header button, header label {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
      border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
      border: 1px solid #3f3f46; background: #27272a; color: #f4f4f5;
    }
    #exportPdfBtn { background: #f4f4f5; color: #18181b; border-color: #f4f4f5; }
    #prevPageBtn, #nextPageBtn, #zoomOutBtn, #zoomInBtn, #zoomResetBtn {
      background: transparent; border: none; padding: 4px 6px; color: #d4d4d8;
    }
    #fileNameLabel { font-size: 12px; color: #d4d4d8; font-weight: 500; margin-left: 4px; }
    #textRecBadge { font-size: 11px; color: #34d399; background: #27272a; border: 1px solid #3f3f46; padding: 3px 8px; border-radius: 6px; font-weight: 500; }
    #pageIndicator { font-size: 12px; color: #d4d4d8; font-weight: 500; padding: 0 6px; }
    svg { width: 16px; height: 16px; flex-shrink: 0; }
    .hidden, .sr-only { display: none !important; }
    #viewport {
      flex: 1; overflow-y: auto; overflow-x: auto; position: relative;
      background-color: #18181b; padding: 24px 16px 112px 16px;
    }
    #pagesContainer { display: flex; flex-direction: column; align-items: center; }
    .bottom-dock {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      z-index: 50; display: flex; align-items: center; gap: 6px;
      background: rgba(24, 24, 27, 0.96); border: 1px solid #3f3f46;
      border-radius: 16px; padding: 8px 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.65);
    }
    .tool-btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px;
      border-radius: 12px; border: 1px solid transparent; background: transparent;
      color: #f4f4f5; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .swatch-dot {
      width: 16px; height: 16px; border-radius: 9999px;
      border: 1px solid rgba(0,0,0,0.25); display: inline-block; flex-shrink: 0;
    }
    .dock-divider { width: 1px; height: 24px; background: #3f3f46; margin: 0 4px; }
    .dock-hint { display: flex; align-items: center; gap: 8px; padding: 0 8px; font-size: 11px; color: #a1a1aa; }
    #statusToast {
      position: fixed; top: 64px; left: 50%; transform: translateX(-50%);
      z-index: 50; pointer-events: none; opacity: 0;
      background: rgba(39, 39, 42, 0.95); border: 1px solid #52525b;
      color: #f4f4f5; font-size: 12px; font-weight: 500; padding: 6px 14px;
      border-radius: 9999px;
    }
    #statusToast.opacity-100 { opacity: 1; }
    body {
      margin: 0;
      padding: 0;
      background-color: #18181b;
      color: #f4f4f5;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #18181b;
    }
    ::-webkit-scrollbar-thumb {
      background: #3f3f46;
      border-radius: 5px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #52525b;
    }
    .page-wrapper {
      position: relative;
      margin: 0 auto 24px auto;
      background: #ffffff;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
      border-radius: 2px;
      overflow: hidden;
      transition: transform 0.1s ease;
    }
    .pdf-canvas {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .annotation-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .highlight-item {
      position: absolute;
      mix-blend-mode: multiply;
      opacity: 0.45;
      border-radius: 3px;
      cursor: pointer;
      transition: box-shadow 0.12s ease, opacity 0.12s ease;
    }
    .highlight-item:hover {
      box-shadow: 0 0 0 1.5px rgba(24, 24, 27, 0.45);
    }
    .highlight-item.selected {
      box-shadow: 0 0 0 2px #18181b, 0 0 0 4px #ffffff;
      z-index: 25;
    }
    .highlight-preview {
      position: absolute;
      mix-blend-mode: multiply;
      opacity: 0.45;
      border-radius: 3px;
      pointer-events: none;
      z-index: 20;
    }
    /* GitHub Primer style note box */
    .textbox-item {
      position: absolute;
      width: 210px;
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      box-shadow: 0 1px 3px rgba(31, 35, 40, 0.12), 0 8px 24px rgba(66, 74, 83, 0.12);
      z-index: 30;
      padding: 6px 10px;
      cursor: grab;
      transition: border-color 0.12s ease, box-shadow 0.12s ease;
    }
    .textbox-item:active {
      cursor: grabbing;
    }
    .textbox-item.selected,
    .textbox-item:focus-within {
      border-color: #0969da;
      box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.15), 0 8px 24px rgba(66, 74, 83, 0.12);
      z-index: 40;
    }
    .textbox-del-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: #656d76;
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.1s ease, background-color 0.1s ease, color 0.1s ease;
    }
    .textbox-item:hover .textbox-del-btn,
    .textbox-item:focus-within .textbox-del-btn {
      opacity: 1;
    }
    .textbox-del-btn:hover {
      background: #f3f4f6;
      color: #1f2328;
    }
    .textbox-textarea {
      display: block;
      width: 100%;
      min-height: 22px;
      padding: 0;
      padding-right: 14px;
      border: none;
      outline: none;
      resize: none;
      overflow: hidden;
      background: transparent;
      color: #1f2328;
      font-size: 12.5px;
      line-height: 1.5;
      font-weight: 400;
      cursor: text;
      user-select: text;
      -webkit-user-select: text;
    }
    .textbox-textarea::placeholder {
      color: #8c959f;
    }
    .key-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 24px;
      padding: 0 6px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.06);
      transition: all 0.12s ease;
    }
    .tool-btn.active {
      background: #27272a;
      border-color: #71717a;
      transform: translateY(-1px);
    }
    .tool-btn.active .key-badge {
      background: #f4f4f5;
      color: #18181b;
      border-color: #f4f4f5;
    }
    .drop-overlay {
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col select-none">

  <!-- Top Bar -->
  <header class="h-13 bg-zinc-900 border-b border-zinc-800 px-4 py-2 flex items-center justify-between gap-3 shrink-0 z-50">
    <!-- Left: File actions -->
    <div class="flex items-center gap-2">
      <label for="pdfInput" class="cursor-pointer inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-100 text-xs font-semibold border border-zinc-700 transition">
        <svg class="w-4 h-4 text-zinc-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
        </svg>
        <span>PDF 열기</span>
      </label>
      <input id="pdfInput" type="file" accept="application/pdf" class="hidden" />

      <span id="fileNameLabel" class="text-xs text-zinc-300 font-medium truncate max-w-[180px] sm:max-w-[240px] ml-1">
        arXiv_1706.03762_Attention.pdf
      </span>
      <span id="textRecBadge" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-zinc-800 border border-zinc-700 text-[11px] font-medium text-emerald-400">
        글 인식됨 · 336단어
      </span>
    </div>

    <!-- Center: Page & Zoom controls -->
    <div class="flex items-center gap-1.5 bg-zinc-950/70 border border-zinc-800 rounded-lg px-2 py-1">
      <button id="prevPageBtn" type="button" title="이전 페이지" class="p-1 rounded hover:bg-zinc-800 text-zinc-400 hover:text-zinc-100 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <span id="pageIndicator" class="text-xs font-medium text-zinc-300 px-1.5 min-w-[54px] text-center">1 / 3</span>
      <button id="nextPageBtn" type="button" title="다음 페이지" class="p-1 rounded hover:bg-zinc-800 text-zinc-400 hover:text-zinc-100 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
        </svg>
      </button>

      <div class="h-3.5 w-px bg-zinc-800 mx-1"></div>

      <button id="zoomOutBtn" type="button" title="축소" class="p-1 rounded hover:bg-zinc-800 text-zinc-400 hover:text-zinc-100 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4"/>
        </svg>
      </button>
      <button id="zoomResetBtn" type="button" title="배율 초기화" class="text-xs font-medium text-zinc-300 hover:text-white px-1.5 min-w-[48px] text-center transition">
        100%
      </button>
      <button id="zoomInBtn" type="button" title="확대" class="p-1 rounded hover:bg-zinc-800 text-zinc-400 hover:text-zinc-100 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
        </svg>
      </button>
    </div>

    <!-- Right: Undo / Clear / Export -->
    <div class="flex items-center gap-1.5">
      <button id="undoBtn" type="button" title="실행 취소 (Ctrl+Z)" class="p-1.5 rounded-lg bg-zinc-800/80 hover:bg-zinc-700 text-zinc-300 disabled:opacity-35 disabled:pointer-events-none border border-zinc-700/80 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h10a5 5 0 015 5v2M3 10l4-4m-4 4l4 4"/>
        </svg>
      </button>
      <button id="redoBtn" type="button" title="다시 실행 (Ctrl+Y)" class="p-1.5 rounded-lg bg-zinc-800/80 hover:bg-zinc-700 text-zinc-300 disabled:opacity-35 disabled:pointer-events-none border border-zinc-700/80 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 10H11a5 5 0 00-5 5v2m15-7l-4-4m4 4l-4 4"/>
        </svg>
      </button>
      <button id="deleteSelectedBtn" type="button" title="선택 삭제 (Del / 우클릭)" class="hidden sm:inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-zinc-800/80 hover:bg-red-950/70 hover:border-red-800 text-zinc-300 hover:text-red-200 text-xs font-medium border border-zinc-700/80 transition">
        <span>선택 삭제</span>
      </button>
      <button id="exportPdfBtn" type="button" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-zinc-100 hover:bg-white text-zinc-900 text-xs font-semibold transition">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
        <span>PDF 저장</span>
      </button>
    </div>
  </header>

  <!-- Main Viewport -->
  <main id="viewport" class="flex-1 overflow-y-auto overflow-x-auto relative bg-zinc-900 px-4 pt-6 pb-28">
    <div id="pagesContainer" class="flex flex-col items-center"></div>

    <!-- Drag & Drop Overlay -->
    <div id="dropOverlay" class="hidden fixed inset-0 z-50 drop-overlay bg-zinc-950/75 flex items-center justify-center p-6 pointer-events-none">
      <div class="border-2 border-dashed border-zinc-400 rounded-2xl px-10 py-8 text-center bg-zinc-900/90">
        <p class="text-base font-semibold text-zinc-100">PDF 파일을 여기에 놓으세요</p>
      </div>
    </div>
  </main>

  <!-- Bottom Floating QWER + Space Dock -->
  <div class="bottom-dock fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex items-center gap-1.5 bg-zinc-900/95 backdrop-blur-md border border-zinc-700/80 rounded-2xl px-2.5 py-2 shadow-2xl">
    <!-- Q -->
    <button type="button" data-slot="0" class="tool-btn group flex items-center gap-2 px-2.5 py-1.5 rounded-xl border border-transparent hover:bg-zinc-800/80 transition">
      <span class="key-badge">Q</span>
      <span id="swatch-0" class="swatch-dot w-4 h-4 rounded-full border border-black/20 shrink-0" style="background-color: #fde047;"></span>
      <input type="color" data-color-slot="0" value="#fde047" title="Q 색상 변경" class="sr-only" />
    </button>

    <!-- W -->
    <button type="button" data-slot="1" class="tool-btn group flex items-center gap-2 px-2.5 py-1.5 rounded-xl border border-transparent hover:bg-zinc-800/80 transition">
      <span class="key-badge">W</span>
      <span id="swatch-1" class="swatch-dot w-4 h-4 rounded-full border border-black/20 shrink-0" style="background-color: #86efac;"></span>
      <input type="color" data-color-slot="1" value="#86efac" title="W 색상 변경" class="sr-only" />
    </button>

    <!-- E -->
    <button type="button" data-slot="2" class="tool-btn group flex items-center gap-2 px-2.5 py-1.5 rounded-xl border border-transparent hover:bg-zinc-800/80 transition">
      <span class="key-badge">E</span>
      <span id="swatch-2" class="swatch-dot w-4 h-4 rounded-full border border-black/20 shrink-0" style="background-color: #7dd3fc;"></span>
      <input type="color" data-color-slot="2" value="#7dd3fc" title="E 색상 변경" class="sr-only" />
    </button>

    <!-- R -->
    <button type="button" data-slot="3" class="tool-btn group flex items-center gap-2 px-2.5 py-1.5 rounded-xl border border-transparent hover:bg-zinc-800/80 transition">
      <span class="key-badge">R</span>
      <span id="swatch-3" class="swatch-dot w-4 h-4 rounded-full border border-black/20 shrink-0" style="background-color: #f9a8d4;"></span>
      <input type="color" data-color-slot="3" value="#f9a8d4" title="R 색상 변경" class="sr-only" />
    </button>

    <div class="dock-divider h-6 w-px bg-zinc-700/80 mx-1"></div>

    <!-- Space: Text Box -->
    <button id="spaceToolBtn" type="button" class="tool-btn flex items-center gap-2 px-3 py-1.5 rounded-xl border border-transparent hover:bg-zinc-800/80 transition">
      <span class="key-badge px-2">Space</span>
      <span class="text-xs font-semibold text-zinc-200">텍스트</span>
    </button>

    <div class="dock-divider hidden md:block h-6 w-px bg-zinc-700/80 mx-1"></div>

    <!-- Compact shortcut hint -->
    <div class="dock-hint hidden md:flex items-center gap-2 px-2 text-[11px] text-zinc-400">
      <span>드래그: 하이라이트</span>
      <span>·</span>
      <span>ESC: 입력 완료</span>
      <span>·</span>
      <span>우클릭: 삭제</span>
    </div>
  </div>

  <!-- Toast status (minimal) -->
  <div id="statusToast" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-opacity duration-150 bg-zinc-800/95 border border-zinc-700 text-zinc-100 text-xs font-medium px-3 py-1.5 rounded-full shadow-lg"></div>

    let toastTimer = null;
    function showToast(msg) {
      statusToast.textContent = msg;
      statusToast.classList.remove('opacity-0');
      statusToast.classList.add('opacity-100');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        statusToast.classList.remove('opacity-100');
        statusToast.classList.add('opacity-0');
      }, 1100);
    }

    function uid() {
      return 'ann_' + Math.random().toString(36).slice(2, 10) + '_' + Date.now().toString(36);
    }

    function cloneAnnotations(list) {
      return list.map(item => ({ ...item, rects: item.rects ? item.rects.map(r => ({ ...r })) : undefined }));
    }

    function pushHistory() {
      state.undoStack.push(cloneAnnotations(state.annotations));
      if (state.undoStack.length > 60) state.undoStack.shift();
      state.redoStack = [];
      updateHistoryButtons();
    }

    function updateHistoryButtons() {
      undoBtn.disabled = state.undoStack.length === 0;
      redoBtn.disabled = state.redoStack.length === 0;
    }

    function undo() {
      if (state.undoStack.length === 0) return;
      state.redoStack.push(cloneAnnotations(state.annotations));
      state.annotations = state.undoStack.pop();
      state.selectedId = null;
      renderAllAnnotations();
      updateHistoryButtons();
    }

    function redo() {
      if (state.redoStack.length === 0) return;
      state.undoStack.push(cloneAnnotations(state.annotations));
      state.annotations = state.redoStack.pop();
      state.selectedId = null;
      renderAllAnnotations();
      updateHistoryButtons();
    }

    function updateToolUI() {
      slotButtons.forEach((btn, idx) => {
        const isActive = state.mode === 'highlight' && state.activeSlot === idx;
        btn.classList.toggle('active', isActive);
      });
      spaceToolBtn.classList.toggle('active', state.mode === 'textbox');
    }

    function selectSlot(slotIndex) {
      state.activeSlot = slotIndex;
      state.mode = 'highlight';
      // If an annotation is currently selected, also update its color immediately
      if (state.selectedId) {
        const target = state.annotations.find(a => a.id === state.selectedId);
        if (target && target.color !== state.colors[slotIndex]) {
          pushHistory();
          target.color = state.colors[slotIndex];
          renderPageAnnotations(target.page);
        }
      }
      updateToolUI();
    }

    function drawSamplePage(canvas, pageNumber, width, height) {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, width, height);

      if (samplePageImg.complete && samplePageImg.naturalWidth > 0) {
        ctx.drawImage(samplePageImg, 0, 0, width, height);
      } else {
        samplePageImg.onload = () => {
          const c = canvas.getContext('2d');
          c.save();
          c.setTransform(dpr, 0, 0, dpr, 0, 0);
          c.drawImage(samplePageImg, 0, 0, width, height);
          c.restore();
        };
      }
    }

    // Extract word-level bounding boxes from any uploaded PDF page via PDF.js getTextContent()
    async function extractPdfPageTokens(pdfPage, pdfViewport) {
      try {
        const textContent = await pdfPage.getTextContent();
        const W = pdfViewport.width;
        const H = pdfViewport.height;
        const rawTokens = [];

        for (const item of textContent.items) {
          const str = item.str;
          if (!str || !str.trim()) continue;
          const tx = window.pdfjsLib.Util.transform(pdfViewport.transform, item.transform);
          const fontHeight = Math.hypot(tx[2], tx[3]) || Math.abs(tx[3]) || 12;
          const left = tx[4];
          const top = tx[5] - fontHeight * 0.88;
          const totalW = (item.width ? item.width * (pdfViewport.scale || 1) : str.length * fontHeight * 0.52);

          // Split string into words while preserving proportional horizontal positions
          const parts = str.split(/(\s+)/);
          let charCursor = 0;
          const totalLen = Math.max(1, str.length);
          for (const part of parts) {
            if (!part) continue;
            const partLen = part.length;
            if (part.trim().length > 0) {
              const wx = (left + (charCursor / totalLen) * totalW) / W;
              const ww = Math.max(0.004, ((partLen / totalLen) * totalW) / W);
              const wy = Math.max(0, top / H);
              const wh = Math.max(0.01, (fontHeight * 1.08) / H);
              rawTokens.push({ str: part, x: wx, y: wy, w: ww, h: wh });
            }
            charCursor += partLen;
          }
        }

        // Group tokens into horizontal reading lines
        const lines = [];
        for (const tok of rawTokens) {
          const cy = tok.y + tok.h * 0.5;
          let matched = null;
          for (const line of lines) {
            if (Math.abs(line.cy - cy) < 0.009) {
              matched = line;
              break;
            }
          }
          if (matched) {
            matched.items.push(tok);
            matched.cy = matched.items.reduce((s, i) => s + i.y + i.h * 0.5, 0) / matched.items.length;
          } else {
            lines.push({ cy, items: [tok] });
          }
        }

        lines.sort((a, b) => a.cy - b.cy);
        const finalTokens = [];
        lines.forEach((line, lineIdx) => {
          line.items.sort((a, b) => a.x - b.x);
          const lineTop = Math.min(...line.items.map(i => i.y));
          const lineBot = Math.max(...line.items.map(i => i.y + i.h));
          const lineH = lineBot - lineTop;
          line.items.forEach(i => {
            finalTokens.push({
              str: i.str,
              x: i.x,
              y: lineTop,
              w: i.w,
              h: lineH,
              line: lineIdx
            });
          });
        });

        return finalTokens;
      } catch (e) {
        return [];
      }
    }

    function updateTextRecBadge() {
      const badge = document.getElementById('textRecBadge');
      if (!badge) return;
      let totalWords = 0;
      Object.values(state.pageTokens || {}).forEach(arr => {
        if (Array.isArray(arr)) totalWords += arr.length;
      });
      if (totalWords > 0) {
        badge.textContent = `글 인식됨 · ${totalWords}단어`;
      } else {
        badge.textContent = '영역 하이라이트 모드';
      }
    }

    // Find nearest text token index at normalized coordinates (xNorm, yNorm)
    function findNearestTokenIndex(tokens, xNorm, yNorm) {
      if (!tokens || tokens.length === 0) return -1;
      let bestIdx = -1;
      let bestScore = Infinity;
      for (let i = 0; i < tokens.length; i++) {
        const t = tokens[i];
        const dy = yNorm < t.y ? (t.y - yNorm) : (yNorm > t.y + t.h ? yNorm - (t.y + t.h) : 0);
        if (dy > 0.028) continue;
        const dx = xNorm < t.x ? (t.x - xNorm) : (xNorm > t.x + t.w ? xNorm - (t.x + t.w) : 0);
        if (dx > 0.09) continue;
        const score = dy * 4.5 + dx;
        if (score < bestScore) {
          bestScore = score;
          bestIdx = i;
        }
      }
      return bestIdx;
    }

    // Given drag start & end normalized coords, compute recognized word-snapped line rects
    function computeHighlightGeometry(pageNum, x1Norm, y1Norm, x2Norm, y2Norm) {
      const tokens = state.pageTokens && state.pageTokens[pageNum];
      if (tokens && tokens.length > 0) {
        const startIdx = findNearestTokenIndex(tokens, x1Norm, y1Norm);
        const endIdx = findNearestTokenIndex(tokens, x2Norm, y2Norm);
        if (startIdx !== -1 && endIdx !== -1) {
          const lo = Math.min(startIdx, endIdx);
          const hi = Math.max(startIdx, endIdx);
          const selected = tokens.slice(lo, hi + 1);
          const lineGroups = new Map();
          selected.forEach(tok => {
            if (!lineGroups.has(tok.line)) lineGroups.set(tok.line, []);
            lineGroups.get(tok.line).push(tok);
          });
          const rects = [];
          lineGroups.forEach(group => {
            const minX = Math.min(...group.map(g => g.x));
            const maxX = Math.max(...group.map(g => g.x + g.w));
            const minY = Math.min(...group.map(g => g.y));
            const maxY = Math.max(...group.map(g => g.y + g.h));
            rects.push({
              x: minX,
              y: minY,
              w: maxX - minX,
              h: maxY - minY
            });
          });
          if (rects.length > 0) {
            return {
              rects,
              recognizedText: selected.map(s => s.str).join(' ')
            };
          }
        }
      }

      // Fallback: freeform box highlight
      const left = Math.min(x1Norm, x2Norm);
      const rawTop = Math.min(y1Norm, y2Norm);
      const width = Math.abs(x2Norm - x1Norm);
      const rawHeight = Math.abs(y2Norm - y1Norm);
      const finalHeight = rawHeight < 0.013 ? 0.018 : rawHeight;
      const finalTop = rawHeight < 0.013 ? Math.max(0, y1Norm - 0.009) : rawTop;
      return {
        rects: [{ x: left, y: finalTop, w: width, h: finalHeight }],
        recognizedText: ''
      };
    }

    async function renderDocument() {
      pagesContainer.innerHTML = '';
      pageIndicator.textContent = `${state.currentPage} / ${state.numPages}`;
      zoomResetBtn.textContent = `${Math.round(state.scale * 100)}%`;

      for (let pageNum = 1; pageNum <= state.numPages; pageNum++) {
        let pageW = state.baseWidth * state.scale;
        let pageH = state.baseHeight * state.scale;
        let pdfPage = null;
        let pdfViewport = null;

        if (!state.isSample && state.pdfDoc) {
          pdfPage = await state.pdfDoc.getPage(pageNum);
          const unscaledViewport = pdfPage.getViewport({ scale: 1 });
          const fitScale = (state.baseWidth / unscaledViewport.width) * state.scale;
          pdfViewport = pdfPage.getViewport({ scale: fitScale });
          pageW = pdfViewport.width;
          pageH = pdfViewport.height;
        }

        const wrapper = document.createElement('div');
        wrapper.className = 'page-wrapper';
        wrapper.dataset.page = String(pageNum);
        wrapper.style.width = `${pageW}px`;
        wrapper.style.height = `${pageH}px`;

        const canvas = document.createElement('canvas');
        canvas.className = 'pdf-canvas';
        wrapper.appendChild(canvas);

        const annLayer = document.createElement('div');
        annLayer.className = 'annotation-layer';
        annLayer.dataset.page = String(pageNum);
        wrapper.appendChild(annLayer);

        pagesContainer.appendChild(wrapper);

        if (state.isSample) {
          drawSamplePage(canvas, pageNum, pageW, pageH);
        } else if (pdfPage && pdfViewport) {
          const dpr = window.devicePixelRatio || 1;
          canvas.width = Math.floor(pdfViewport.width * dpr);
          canvas.height = Math.floor(pdfViewport.height * dpr);
          const ctx = canvas.getContext('2d');
          ctx.scale(dpr, dpr);
          await pdfPage.render({
            canvasContext: ctx,
            viewport: pdfViewport
          }).promise;
          if (!state.pageTokens[pageNum]) {
            state.pageTokens[pageNum] = await extractPdfPageTokens(pdfPage, pdfViewport);
            updateTextRecBadge();
          }
        }

        attachPageEvents(annLayer, pageNum);
        renderPageAnnotations(pageNum);
      }
    }

    function attachPageEvents(annLayer, pageNum) {
      let isDrawing = false;
      let startXNorm = 0;
      let startYNorm = 0;
      let previewEls = [];

      function clearPreviews() {
        previewEls.forEach(el => el.remove());
        previewEls = [];
      }

      function renderPreviews(rects) {
        clearPreviews();
        rects.forEach(r => {
          const el = document.createElement('div');
          el.className = 'highlight-preview';
          el.style.backgroundColor = state.colors[state.activeSlot];
          el.style.left = `${r.x * 100}%`;
          el.style.top = `${r.y * 100}%`;
          el.style.width = `${r.w * 100}%`;
          el.style.height = `${r.h * 100}%`;
          annLayer.appendChild(el);
          previewEls.push(el);
        });
      }

      annLayer.addEventListener('mousemove', (e) => {
        const rect = annLayer.getBoundingClientRect();
        const curXNorm = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        const curYNorm = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
        state.pointer.page = pageNum;
        state.pointer.xNorm = Math.max(0.02, Math.min(0.92, curXNorm));
        state.pointer.yNorm = Math.max(0.02, Math.min(0.92, curYNorm));
        state.pointer.overPage = true;

        // Change cursor to text when hovering over recognized text token in highlight mode
        if (!isDrawing && state.mode === 'highlight') {
          const hit = findNearestTokenIndex(state.pageTokens[pageNum], curXNorm, curYNorm);
          annLayer.style.cursor = hit !== -1 ? 'text' : 'crosshair';
        }

        if (!isDrawing) return;
        const geom = computeHighlightGeometry(pageNum, startXNorm, startYNorm, curXNorm, curYNorm);
        renderPreviews(geom.rects);
      });

      annLayer.addEventListener('mouseleave', () => {
        state.pointer.overPage = false;
      });

      annLayer.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        if (e.target !== annLayer) return;

        if (document.activeElement && document.activeElement.tagName === 'TEXTAREA') {
          document.activeElement.blur();
        }

        if (state.selectedId) {
          state.selectedId = null;
          renderAllAnnotations();
        }

        const rect = annLayer.getBoundingClientRect();
        const clickXNorm = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        const clickYNorm = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));

        if (state.mode === 'textbox') {
          e.preventDefault();
          createTextboxAt(pageNum, clickXNorm, clickYNorm);
          return;
        }

        isDrawing = true;
        startXNorm = clickXNorm;
        startYNorm = clickYNorm;
        const geom = computeHighlightGeometry(pageNum, startXNorm, startYNorm, clickXNorm, clickYNorm);
        renderPreviews(geom.rects);
      });

      window.addEventListener('mouseup', (e) => {
        if (!isDrawing) return;
        isDrawing = false;
        clearPreviews();

        const rect = annLayer.getBoundingClientRect();
        const curXNorm = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        const curYNorm = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));

        const dragDistPx = Math.hypot((curXNorm - startXNorm) * rect.width, (curYNorm - startYNorm) * rect.height);
        if (dragDistPx < 6) return;

        const geom = computeHighlightGeometry(pageNum, startXNorm, startYNorm, curXNorm, curYNorm);
        if (!geom.rects || geom.rects.length === 0) return;

        pushHistory();
        const first = geom.rects[0];
        const newAnn = {
          id: uid(),
          page: pageNum,
          type: 'highlight',
          x: first.x,
          y: first.y,
          w: first.w,
          h: first.h,
          rects: geom.rects,
          recognizedText: geom.recognizedText || '',
          color: state.colors[state.activeSlot]
        };
        state.annotations.push(newAnn);
        renderPageAnnotations(pageNum);
      });
    }

    function createTextboxAt(pageNum, xNorm, yNorm) {
      pushHistory();
      const clampedX = Math.max(0.03, Math.min(0.72, xNorm));
      const clampedY = Math.max(0.03, Math.min(0.88, yNorm));
      const newBox = {
        id: uid(),
        page: pageNum,
        type: 'textbox',
        x: clampedX,
        y: clampedY,
        w: 0.26,
        h: 0.06,
        color: state.colors[state.activeSlot],
        text: ''
      };
      state.annotations.push(newBox);
      state.selectedId = newBox.id;
      state.mode = 'highlight';
      updateToolUI();
      renderPageAnnotations(pageNum, newBox.id);
    }

    function renderAllAnnotations() {
      for (let p = 1; p <= state.numPages; p++) {
        renderPageAnnotations(p);
      }
    }

    function renderPageAnnotations(pageNum, focusId = null) {
      const annLayer = pagesContainer.querySelector(`.annotation-layer[data-page="${pageNum}"]`);
      if (!annLayer) return;
      annLayer.innerHTML = '';

      const pageItems = state.annotations.filter(a => a.page === pageNum);

      pageItems.forEach(item => {
        if (item.type === 'highlight') {
          const rects = (item.rects && item.rects.length > 0)
            ? item.rects
            : [{ x: item.x, y: item.y, w: item.w, h: item.h }];

          rects.forEach(r => {
            const el = document.createElement('div');
            el.className = 'highlight-item' + (state.selectedId === item.id ? ' selected' : '');
            el.style.left = `${r.x * 100}%`;
            el.style.top = `${r.y * 100}%`;
            el.style.width = `${r.w * 100}%`;
            el.style.height = `${r.h * 100}%`;
            el.style.backgroundColor = item.color;
            if (item.recognizedText) {
              el.title = item.recognizedText;
            }

            el.addEventListener('mousedown', (e) => {
              e.stopPropagation();
              if (e.button === 0) {
                state.selectedId = item.id;
                renderAllAnnotations();
              }
            });

            el.addEventListener('contextmenu', (e) => {
              e.preventDefault();
              e.stopPropagation();
              deleteAnnotationById(item.id);
            });

            annLayer.appendChild(el);
          });
        } else if (item.type === 'textbox') {
          const box = document.createElement('div');
          box.className = 'textbox-item' + (state.selectedId === item.id ? ' selected' : '');
          box.style.left = `${item.x * 100}%`;
          box.style.top = `${item.y * 100}%`;

          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'textbox-del-btn';
          delBtn.textContent = '×';
          delBtn.title = '삭제';
          delBtn.addEventListener('mousedown', (e) => {
            e.stopPropagation();
          });
          delBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            deleteAnnotationById(item.id);
          });

          const textarea = document.createElement('textarea');
          textarea.className = 'textbox-textarea';
          textarea.placeholder = '메모 입력...';
          textarea.value = item.text || '';
          textarea.rows = 1;

          const autoResize = () => {
            textarea.style.height = 'auto';
            textarea.style.height = `${Math.max(20, textarea.scrollHeight)}px`;
          };

          textarea.addEventListener('mousedown', (e) => {
            e.stopPropagation();
            state.selectedId = item.id;
          });

          textarea.addEventListener('input', () => {
            item.text = textarea.value;
            autoResize();
          });

          textarea.addEventListener('keydown', (e) => {
            if (e.code === 'Escape' || (e.code === 'Enter' && (e.ctrlKey || e.metaKey))) {
              e.preventDefault();
              e.stopPropagation();
              textarea.blur();
              state.mode = 'highlight';
              updateToolUI();
              showToast('하이라이트 모드 (Q·W·E·R)');
            }
          });

          textarea.addEventListener('blur', () => {
            const trimmed = (item.text || '').trim();
            if (!trimmed) {
              state.annotations = state.annotations.filter(a => a.id !== item.id);
              if (state.selectedId === item.id) state.selectedId = null;
              renderPageAnnotations(pageNum);
            }
          });

          // Dragging textbox by its container padding/border
          box.addEventListener('mousedown', (e) => {
            if (e.button !== 0 || e.target === textarea || e.target === delBtn) return;
            e.stopPropagation();
            e.preventDefault();
            state.selectedId = item.id;

            const layerRect = annLayer.getBoundingClientRect();
            const startMouseX = e.clientX;
            const startMouseY = e.clientY;
            const origX = item.x;
            const origY = item.y;

            const onMove = (moveEvent) => {
              const dx = (moveEvent.clientX - startMouseX) / layerRect.width;
              const dy = (moveEvent.clientY - startMouseY) / layerRect.height;
              item.x = Math.max(0.01, Math.min(0.82, origX + dx));
              item.y = Math.max(0.01, Math.min(0.92, origY + dy));
              box.style.left = `${item.x * 100}%`;
              box.style.top = `${item.y * 100}%`;
            };

            const onUp = () => {
              window.removeEventListener('mousemove', onMove);
              window.removeEventListener('mouseup', onUp);
            };

            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onUp);
          });

          box.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            e.stopPropagation();
            deleteAnnotationById(item.id);
          });

          box.appendChild(delBtn);
          box.appendChild(textarea);
          annLayer.appendChild(box);
          autoResize();

          if (focusId === item.id) {
            requestAnimationFrame(() => {
              textarea.focus();
            });
          }
        }
      });
    }

    function deleteAnnotationById(id) {
      const target = state.annotations.find(a => a.id === id);
      if (!target) return;
      pushHistory();
      const pageNum = target.page;
      state.annotations = state.annotations.filter(a => a.id !== id);
      if (state.selectedId === id) state.selectedId = null;
      renderPageAnnotations(pageNum);
    }

    // Keyboard Shortcuts: Q, W, E, R, Space, Esc, Delete, Undo/Redo
    window.addEventListener('keydown', (e) => {
      const activeEl = document.activeElement;
      const isTyping =
        activeEl &&
        (activeEl.tagName === 'TEXTAREA' ||
          (activeEl.tagName === 'INPUT' && activeEl.type !== 'color' && activeEl.type !== 'file'));

      if (isTyping) {
        // Let normal typing happen inside textarea
        return;
      }

      // Undo / Redo
      if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ') {
        e.preventDefault();
        if (e.shiftKey) {
          redo();
        } else {
          undo();
        }
        return;
      }
      if ((e.ctrlKey || e.metaKey) && e.code === 'KeyY') {
        e.preventDefault();
        redo();
        return;
      }

      // Physical key codes work regardless of Korean/English IME state
      if (!e.ctrlKey && !e.metaKey && !e.altKey) {
        if (e.code === 'KeyQ') {
          e.preventDefault();
          selectSlot(0);
          return;
        }
        if (e.code === 'KeyW') {
          e.preventDefault();
          selectSlot(1);
          return;
        }
        if (e.code === 'KeyE') {
          e.preventDefault();
          selectSlot(2);
          return;
        }
        if (e.code === 'KeyR') {
          e.preventDefault();
          selectSlot(3);
          return;
        }
        if (e.code === 'Space') {
          e.preventDefault(); // Prevent browser page scroll
          const targetPage = state.pointer.overPage ? state.pointer.page : state.currentPage;
          const targetX = state.pointer.overPage ? state.pointer.xNorm : 0.38;
          const targetY = state.pointer.overPage ? state.pointer.yNorm : 0.35;
          createTextboxAt(targetPage, targetX, targetY);
          return;
        }
        if (e.code === 'Delete' || e.code === 'Backspace') {
          if (state.selectedId) {
            e.preventDefault();
            deleteAnnotationById(state.selectedId);
          }
          return;
        }
        if (e.code === 'Escape') {
          if (state.selectedId || state.mode !== 'highlight') {
            state.selectedId = null;
            state.mode = 'highlight';
            updateToolUI();
            renderAllAnnotations();
          }
          return;
        }
      }
    });

    // Bottom Dock Buttons
    slotButtons.forEach((btn, idx) => {
      btn.addEventListener('click', () => {
        selectSlot(idx);
      });
      // Double-click to customize slot color
      btn.addEventListener('dblclick', () => {
        const input = colorInputs[idx];
        if (input) input.click();
      });
    });

    colorInputs.forEach((input, idx) => {
      input.addEventListener('input', (e) => {
        const newColor = e.target.value;
        state.colors[idx] = newColor;
        const swatch = document.getElementById(`swatch-${idx}`);
        if (swatch) swatch.style.backgroundColor = newColor;
        selectSlot(idx);
      });
    });

    spaceToolBtn.addEventListener('click', () => {
      if (state.mode === 'textbox') {
        state.mode = 'highlight';
        updateToolUI();
      } else {
        state.mode = 'textbox';
        updateToolUI();
        showToast('원하는 위치를 클릭하거나 Space를 눌러 텍스트 박스 추가');
      }
    });

    // Top Bar Controls
    undoBtn.addEventListener('click', undo);
    redoBtn.addEventListener('click', redo);

    deleteSelectedBtn.addEventListener('click', () => {
      if (state.selectedId) {
        deleteAnnotationById(state.selectedId);
      } else {
        showToast('삭제할 항목을 클릭하거나 우클릭하세요');
      }
    });

    zoomInBtn.addEventListener('click', () => {
      state.scale = Math.min(2.2, +(state.scale + 0.15).toFixed(2));
      renderDocument();
    });

    zoomOutBtn.addEventListener('click', () => {
      state.scale = Math.max(0.6, +(state.scale - 0.15).toFixed(2));
      renderDocument();
    });

    zoomResetBtn.addEventListener('click', () => {
      state.scale = 1.0;
      renderDocument();
    });

    function scrollToPage(pageNum) {
      const target = pagesContainer.querySelector(`.page-wrapper[data-page="${pageNum}"]`);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        state.currentPage = pageNum;
        pageIndicator.textContent = `${state.currentPage} / ${state.numPages}`;
      }
    }

    prevPageBtn.addEventListener('click', () => {
      if (state.currentPage > 1) scrollToPage(state.currentPage - 1);
    });

    nextPageBtn.addEventListener('click', () => {
      if (state.currentPage < state.numPages) scrollToPage(state.currentPage + 1);
    });

    viewport.addEventListener('scroll', () => {
      const wrappers = Array.from(pagesContainer.querySelectorAll('.page-wrapper'));
      const viewMid = viewport.scrollTop + viewport.clientHeight * 0.35;
      for (const w of wrappers) {
        const top = w.offsetTop;
        const bottom = top + w.offsetHeight;
        if (viewMid >= top && viewMid <= bottom) {
          const p = Number(w.dataset.page);
          if (p !== state.currentPage) {
            state.currentPage = p;
            pageIndicator.textContent = `${state.currentPage} / ${state.numPages}`;
          }
          break;
        }
      }
    });

    // Load PDF File
    async function loadPdfFile(file) {
      if (!file) return;
      try {
        const arrayBuffer = await file.arrayBuffer();
        const loadingTask = window.pdfjsLib.getDocument({ data: arrayBuffer });
        const pdfDoc = await loadingTask.promise;

        state.pdfDoc = pdfDoc;
        state.isSample = false;
        state.numPages = pdfDoc.numPages;
        state.currentPage = 1;
        state.pageTokens = {};
        state.annotations = [];
        state.undoStack = [];
        state.redoStack = [];
        state.selectedId = null;
        fileNameLabel.textContent = file.name;
        updateHistoryButtons();
        viewport.scrollTop = 0;

        await renderDocument();
        showToast('PDF 로드 완료');
      } catch (err) {
        showToast('PDF 파일을 열 수 없습니다');
      }
    }

    pdfInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) loadPdfFile(file);
      pdfInput.value = '';
    });

    // Drag and Drop PDF support
    window.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropOverlay.classList.remove('hidden');
    });

    window.addEventListener('dragleave', (e) => {
      if (e.relatedTarget === null) {
        dropOverlay.classList.add('hidden');
      }
    });

    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dropOverlay.classList.add('hidden');
      const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (file && (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf'))) {
        loadPdfFile(file);
      } else if (file) {
        showToast('PDF 파일만 열 수 있습니다');
      }
    });

    // Export Annotated PDF
    exportPdfBtn.addEventListener('click', async () => {
      if (!window.jspdf || !window.jspdf.jsPDF) {
        showToast('PDF 내보내기 준비 중입니다');
        return;
      }
      showToast('PDF 생성 중...');

      const { jsPDF } = window.jspdf;
      const wrappers = Array.from(pagesContainer.querySelectorAll('.page-wrapper'));
      if (wrappers.length === 0) return;

      let pdfOut = null;

      for (let i = 0; i < wrappers.length; i++) {
        const wrapper = wrappers[i];
        const pageNum = Number(wrapper.dataset.page);
        const baseCanvas = wrapper.querySelector('.pdf-canvas');
        const w = baseCanvas.width;
        const h = baseCanvas.height;

        const outCanvas = document.createElement('canvas');
        outCanvas.width = w;
        outCanvas.height = h;
        const ctx = outCanvas.getContext('2d');

        // 1. Draw original PDF page
        ctx.drawImage(baseCanvas, 0, 0, w, h);

        // 2. Draw highlights with multiply blend mode
        const pageAnns = state.annotations.filter(a => a.page === pageNum);
        ctx.save();
        ctx.globalCompositeOperation = 'multiply';
        pageAnns
          .filter(a => a.type === 'highlight')
          .forEach(hl => {
            ctx.fillStyle = hl.color;
            const rects = (hl.rects && hl.rects.length > 0) ? hl.rects : [{ x: hl.x, y: hl.y, w: hl.w, h: hl.h }];
            rects.forEach(r => {
              ctx.fillRect(r.x * w, r.y * h, r.w * w, r.h * h);
            });
          });
        ctx.restore();

        // 3. Draw textboxes
        pageAnns
          .filter(a => a.type === 'textbox' && (a.text || '').trim().length > 0)
          .forEach(tb => {
            const x = tb.x * w;
            const y = tb.y * h;
            const scaleRatio = w / state.baseWidth;
            const fontSize = Math.round(13 * scaleRatio);
            const lineHeight = Math.round(19 * scaleRatio);
            const padX = Math.round(10 * scaleRatio);
            const padY = Math.round(8 * scaleRatio);

            ctx.font = `500 ${fontSize}px "Noto Sans KR", "Noto Sans CJK KR", "Inter", sans-serif`;
            const lines = (tb.text || '').split('\n');
            let maxLineW = Math.round(140 * scaleRatio);
            lines.forEach(l => {
              const m = ctx.measureText(l).width;
              if (m > maxLineW) maxLineW = m;
            });

            const boxW = maxLineW + padX * 2 + Math.round(6 * scaleRatio);
            const boxH = lines.length * lineHeight + padY * 2;

            ctx.fillStyle = 'rgba(255, 255, 255, 0.96)';
            ctx.fillRect(x, y, boxW, boxH);
            ctx.strokeStyle = '#d4d4d8';
            ctx.lineWidth = Math.max(1, scaleRatio);
            ctx.strokeRect(x, y, boxW, boxH);

            

            ctx.fillStyle = '#18181b';
            ctx.textBaseline = 'top';
            lines.forEach((line, idx) => {
              ctx.fillText(line, x + padX + Math.round(4 * scaleRatio), y + padY + idx * lineHeight);
            });
          });

        const imgData = outCanvas.toDataURL('image/jpeg', 0.92);
        const orientation = w > h ? 'l' : 'p';

        if (i === 0) {
          pdfOut = new jsPDF({
            orientation,
            unit: 'px',
            format: [w, h]
          });
        } else {
          pdfOut.addPage([w, h], orientation);
        }
        pdfOut.addImage(imgData, 'JPEG', 0, 0, w, h);
      }

      if (pdfOut) {
        const baseName = (fileNameLabel.textContent || 'annotated.pdf').replace(/\.pdf$/i, '');
        pdfOut.save(`${baseName}_highlighted.pdf`);
        showToast('PDF 저장 완료');
      }
    });

    // Pre-populate multi-line text-recognized highlights using computeHighlightGeometry on the real PDF
    state.annotations = [];
    (function seedRecognizedHighlights() {
      const tokens = state.pageTokens[1] || [];
      if (tokens.length > 300) {
        // 1. Q (Yellow): Multi-line sentence in Abstract ("We propose a new simple network architecture, the Transformer, based solely on attention mechanisms, dispensing with recurrence and convolutions entirely.") -> tokens 68..86 across lines 7, 8, 9!
        const tStart1 = tokens[68], tEnd1 = tokens[86];
        const g1 = computeHighlightGeometry(1, tStart1.x + 0.002, tStart1.y + 0.005, tEnd1.x + tEnd1.w - 0.002, tEnd1.y + 0.005);
        state.annotations.push({
          id: uid(), page: 1, type: 'highlight',
          x: g1.rects[0].x, y: g1.rects[0].y, w: g1.rects[0].w, h: g1.rects[0].h,
          rects: g1.rects, recognizedText: g1.recognizedText, color: state.colors[0]
        });

        // 2. E (Blue): Multi-line sentence in Section 1 ("This inherently sequential nature precludes parallelization within training examples, which becomes critical at longer sequence lengths, as memory constraints limit batching across examples.") -> tokens 217..239 across lines 20, 21, 22!
        const tStart2 = tokens[217], tEnd2 = tokens[239];
        const g2 = computeHighlightGeometry(1, tStart2.x + 0.002, tStart2.y + 0.005, tEnd2.x + tEnd2.w - 0.002, tEnd2.y + 0.005);
        state.annotations.push({
          id: uid(), page: 1, type: 'highlight',
          x: g2.rects[0].x, y: g2.rects[0].y, w: g2.rects[0].w, h: g2.rects[0].h,
          rects: g2.rects, recognizedText: g2.recognizedText, color: state.colors[2]
        });

        // 3. R (Pink): Korean technical metric ("WMT 2014 영-독 번역에서 28.4 BLEU라는 최고 성능을 달성했습니다.") -> tokens 321..330 across lines 30, 31!
        const tStart3 = tokens[321], tEnd3 = tokens[330];
        const g3 = computeHighlightGeometry(1, tStart3.x + 0.002, tStart3.y + 0.005, tEnd3.x + tEnd3.w - 0.002, tEnd3.y + 0.005);
        state.annotations.push({
          id: uid(), page: 1, type: 'highlight',
          x: g3.rects[0].x, y: g3.rects[0].y, w: g3.rects[0].w, h: g3.rects[0].h,
          rects: g3.rects, recognizedText: g3.recognizedText, color: state.colors[3]
        });

        // GitHub Primer Note boxes placed cleanly in right area
        state.annotations.push({
          id: uid(), page: 1, type: 'textbox',
          x: 0.71, y: 0.255, w: 0.25, h: 0.06,
          color: state.colors[0],
          text: 'Recurrence/CNN 배제,\nAttention 단독 구조 제안'
        });
      }
    })();

    // Initialize App
    updateToolUI();
    updateHistoryButtons();
    renderDocument();
  </script>
</body>
</html>
